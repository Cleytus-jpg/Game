<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048 Game with Music</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>2048</h1>
            <div class="score-container">
                <div class="score-box">
                    <span class="score-label">Score</span>
                    <span id="score" class="score-value">0</span>
                </div>
                <div class="score-box">
                    <span class="score-label">Best</span>
                    <span id="best-score" class="score-value">0</span>
                </div>
            </div>
        </div>
        
        <div class="controls">
            <button id="new-game-btn" class="btn">New Game</button>
        </div>

        <div class="game-container">
            <div id="grid-container" class="grid-container">
                <!-- Grid cells will be generated by JavaScript -->
            </div>
            <div id="game-message" class="game-message hidden">
                <div class="message-content">
                    <p id="message-text"></p>
                    <button id="retry-btn" class="btn">Try Again</button>
                </div>
            </div>
        </div>

        <div class="instructions">
            <p><strong>How to play:</strong> Use arrow keys to move tiles. When two tiles with the same number touch, they merge into one!</p>
        </div>

        <!-- Music Player -->
        <div class="music-player">
            <h3>🎵 Music Playlist</h3>
            <div class="music-controls">
                <button id="prev-btn" class="music-btn" title="Previous">⏮</button>
                <button id="play-pause-btn" class="music-btn" title="Play/Pause">▶</button>
                <button id="next-btn" class="music-btn" title="Next">⏭</button>
                <button id="shuffle-btn" class="music-btn" title="Shuffle">🔀</button>
                <button id="volume-btn" class="music-btn" title="Mute/Unmute">🔊</button>
            </div>
            <div class="music-info">
                <div id="current-track" class="current-track">No track playing</div>
                <div class="volume-control">
                    <input type="range" id="volume-slider" min="0" max="100" value="70">
                </div>
            </div>
            <div class="playlist" id="playlist">
                <!-- Playlist items will be generated by JavaScript -->
            </div>
        </div>
    </div>

    <audio id="audio-player" preload="auto"></audio>
    
    <script src="game.js"></script>
</body>
</html>
